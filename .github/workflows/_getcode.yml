name: _getcode
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 从验证码看板取码并写入 CODE Secret
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          NOTE_USER: ${{ secrets.NOTE_USER }}
          NOTE_PASS: ${{ secrets.NOTE_PASS }}
          REPO: ${{ github.repository }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          jar=$(mktemp)
          curl -s --max-time 15 -A "$UA" -c "$jar" -X POST \
            --data-urlencode "username=$NOTE_USER" --data-urlencode "password=$NOTE_PASS" \
            "https://note.zhl2010.ccwu.cc/login" -o /dev/null
          if ! grep -q admin_token "$jar" 2>/dev/null; then
            echo "看板登录失败（未拿到 Cookie）"
            exit 1
          fi
          echo "看板登录成功"
          start=$(TZ=Asia/Shanghai date -d '-10 minutes' '+%Y-%m-%d %H:%M:%S')
          echo "查找时间晚于 $start（北京时间）的验证码"
          for i in $(seq 1 15); do
            codes=$(curl -s --max-time 15 -A "$UA" -b "$jar" "https://note.zhl2010.ccwu.cc/code/" || echo "[]")
            code=$(printf '%s' "$codes" | jq -r --arg s "$start" '[.[] | select(.time > $s)][0].code // empty' 2>/dev/null || echo "")
            if [ -n "$code" ]; then
              gh secret set CODE --body "$code" --repo "$REPO"
              echo "CODE secret 已更新（第 $i 次轮询命中）"
              exit 0
            fi
            if ! printf '%s' "$codes" | jq -e . >/dev/null 2>&1; then
              echo "第 $i 次轮询：看板返回非 JSON（长度 $(printf '%s' "$codes" | wc -c)），重试"
            else
              echo "第 $i 次轮询：暂无新验证码"
            fi
            sleep 10
          done
          echo "看板中未找到新验证码"
          exit 1
