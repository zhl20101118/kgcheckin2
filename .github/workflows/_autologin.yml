name: _autologin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 创建 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json
      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      - name: 发送验证码
        run: |
          echo "START=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          npm run sent
        env:
          PHONE: ${{ secrets.PHONE }}
      - name: 等待短信与转发
        run: sleep 45
      - name: 从看板取码并登录
        env:
          NOTE_USER: ${{ secrets.NOTE_USER }}
          NOTE_PASS: ${{ secrets.NOTE_PASS }}
          PHONE: ${{ secrets.PHONE }}
          PAT: ${{ secrets.PAT }}
          USERINFO: ${{ secrets.USERINFO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPEND_USER: "否"
        run: |
          set -u
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          start="${START}"
          echo "看板时间窗起点(北京时间): $start"
          curl -s -c /tmp/ck.txt -A "$UA" -X POST "https://note.zhl2010.ccwu.cc/login" \
            -F "username=$NOTE_USER" -F "password=$NOTE_PASS" -o /dev/null || true
          code=""
          for i in $(seq 1 26); do
            raw=$(curl -s -b /tmp/ck.txt -A "$UA" -H "Accept: application/json" -H "Cache-Control: no-cache" --max-time 15 "https://note.zhl2010.ccwu.cc/code/?_=$RANDOM$i" || echo "")
            # 兼容 {"items":[...]} 与 [...] 两种格式；code 字段是整条短信，需提取数字验证码
            sms=$(printf '%s' "$raw" | jq -r --arg s "$start" '(if type=="object" then (.items // .codes // []) else . end) | [.[] | select(.time > $s)][0].code // empty' 2>/dev/null || echo "")
            code=$(printf '%s' "$sms" | sed -n 's/.*登录验证码\([0-9]\{4,8\}\).*/\1/p' | head -1)
            if [ -z "$code" ] && [ -n "$sms" ]; then
              code=$(printf '%s' "$sms" | grep -oE '[0-9]{6}' | tail -1)
            fi
            if [ -n "$code" ]; then
              echo "第 $i 次轮询取到验证码（长度 ${#code}）"
              break
            fi
            ncnt=$(printf '%s' "$raw" | jq -r '(if type=="object" then (.items // []) else . end) | length' 2>/dev/null || echo "?")
            newest=$(printf '%s' "$raw" | jq -r '(if type=="object" then (.items // []) else . end) | .[0].time // "无"' 2>/dev/null || echo "?")
            echo "第 $i 次轮询：无新码（条数=$ncnt 最新=$newest）"
            sleep 10
          done
          if [ -z "$code" ]; then
            echo "::error::5 分钟内看板未出现新验证码（请检查手机短信转发器是否在线）"
            exit 1
          fi
          echo "开始手机号登录"
          CODE="$code" npm run phoneLogin
