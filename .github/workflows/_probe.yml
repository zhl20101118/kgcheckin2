name: _probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 探查看板
        env:
          NOTE_USER: ${{ secrets.NOTE_USER }}
          NOTE_PASS: ${{ secrets.NOTE_PASS }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -s -c /tmp/ck.txt -A "$UA" -X POST "https://note.zhl2010.ccwu.cc/login" \
            -F "username=$NOTE_USER" -F "password=$NOTE_PASS" -o /dev/null
          echo "北京现在: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          raw=$(curl -s -b /tmp/ck.txt -A "$UA" --max-time 15 "https://note.zhl2010.ccwu.cc/code/")
          echo "条数: $(printf '%s' "$raw" | jq 'length' 2>/dev/null || echo parse-fail)"
          echo "== 最新 8 条（仅时间与码长度，不显示明文）=="
          printf '%s' "$raw" | jq -r '.[:8][] | "\(.time)  len=\(.code|tostring|length)  digits=\(.code|tostring|test("^[0-9]+$"))"' 2>/dev/null || printf '%s' "$raw" | head -c 600
